<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThermoGuard — Heat Risk Command</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0E1A1E;
    --bg-panel: #142428;
    --bg-panel-hover: #1B3238;
    --border: #223B41;
    --text-primary: #EDEAE0;
    --text-muted: #7FA0A6;
    --safe: #4C9A6A;
    --caution: #E4A73B;
    --danger: #D9622B;
    --extreme: #C22E22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    flex-shrink: 0;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.3px; }
  .brand-sub { color: var(--text-muted); font-size: 13px; }

  .topbar-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-muted); }

  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--safe);
    display: inline-block; margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,154,106,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(76,154,106,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,154,106,0); }
  }

  .refresh-btn {
    background: var(--bg-panel-hover); border: 1px solid var(--border); color: var(--text-primary);
    padding: 7px 14px; border-radius: 5px; font-size: 13px; font-family: 'Inter', sans-serif;
    cursor: pointer; transition: background 0.15s ease;
  }
  .refresh-btn:hover { background: #234047; }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }

  .body { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 340px; flex-shrink: 0; background: var(--bg-panel);
    border-right: 1px solid var(--border); overflow-y: auto;
    display: flex; flex-direction: column;
  }

  .sidebar-header {
    padding: 16px 20px 8px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--text-muted); font-weight: 600;
  }

  .ward-list { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 16px; }

  .ward-card {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease;
    margin-bottom: 6px;
  }
  .ward-card:hover { background: var(--bg-panel-hover); border-color: #2E4B52; }
  .ward-card.active { border-color: var(--text-muted); background: var(--bg-panel-hover); }

  .ward-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .ward-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px; line-height: 1.15; }
  .ward-city { color: var(--text-muted); font-size: 12px; margin-top: 1px; }
  .risk-score { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; line-height: 1; }

  .ward-card-bottom { display: flex; justify-content: space-between; align-items: center; }
  .alert-badge {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .metrics-mini { font-size: 12px; color: var(--text-muted); }

  .map-wrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; background: var(--bg-deep); }

  .legend {
    position: absolute; bottom: 20px; left: 20px;
    background: rgba(20, 36, 40, 0.92); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; font-size: 12px; z-index: 500; backdrop-filter: blur(4px);
  }
  .legend-title { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; margin-bottom: 8px; font-weight: 600; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  .status-banner {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--extreme); color: white; padding: 10px 20px; border-radius: 6px;
    font-size: 13px; font-weight: 500; z-index: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    display: none;
  }
  .status-banner.visible { display: block; }

  .empty-state {
    display: flex; align-items: center; justify-content: center; height: 100%;
    color: var(--text-muted); font-size: 14px; flex-direction: column; gap: 10px;
    text-align: center; padding: 20px;
  }

  .leaflet-popup-content-wrapper { background: var(--bg-panel); color: var(--text-primary); border-radius: 8px; border: 1px solid var(--border); }
  .leaflet-popup-tip { background: var(--bg-panel); }
  .popup-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 6px; }
  .popup-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 2px 0; color: var(--text-muted); }
  .popup-row span:last-child { color: var(--text-primary); font-weight: 500; }

  /* --- Forecast panel --- */
  .forecast-panel {
    position: absolute; bottom: 20px; right: 20px;
    background: rgba(20, 36, 40, 0.95); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; width: 300px; z-index: 500; backdrop-filter: blur(4px); display: none;
  }
  .forecast-panel.visible { display: block; }
  .forecast-panel-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .forecast-panel-sub { color: var(--text-muted); font-size: 11px; margin-bottom: 12px; }
  .forecast-loading { color: var(--text-muted); font-size: 12px; padding: 8px 0; }
  .forecast-day-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .forecast-day-row:last-child { border-bottom: none; }
  .forecast-day-label { font-size: 12.5px; color: var(--text-primary); }
  .forecast-day-badge { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; }
  .forecast-close {
    position: absolute; top: 10px; right: 12px; color: var(--text-muted);
    cursor: pointer; font-size: 16px; background: none; border: none;
  }
  .forecast-close:hover { color: var(--text-primary); }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-name">THERMOGUARD</span>
      <span class="brand-sub">Human Thermal Stress &amp; Heat Risk Command</span>
    </div>
    <div class="topbar-right">
      <span id="statusText"><span class="live-dot"></span>Connecting…</span>
      <span id="lastUpdated"></span>
      <button class="refresh-btn" id="refreshBtn">Refresh now</button>
    </div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="sidebar-header">Wards, ranked by risk</div>
      <div class="ward-list" id="wardList">
        <div class="empty-state">Waiting for data…</div>
      </div>
    </div>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="status-banner" id="statusBanner"></div>

      <div class="legend">
        <div class="legend-title">Risk level</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--safe)"></span>Safe</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--caution)"></span>Caution</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--danger)"></span>Danger</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--extreme)"></span>Extreme Danger</div>
      </div>

      <div class="forecast-panel" id="forecastPanel">
        <button class="forecast-close" onclick="closeForecast()">✕</button>
        <div class="forecast-panel-title" id="forecastTitle">Ward name</div>
        <div class="forecast-panel-sub">5-day early warning forecast</div>
        <div id="forecastBody">
          <div class="forecast-loading">Click a ward to see its forecast</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "https://thermoguard-backend.onrender.com";

  const alertColors = {
    "Safe": "#4C9A6A",
    "Caution": "#E4A73B",
    "Danger": "#D9622B",
    "Extreme Danger": "#C22E22"
  };

  const map = L.map('map', {
    zoomControl: true,
    minZoom: 4,
    maxZoom: 12,
    maxBounds: [[2.0, 58.0], [40.0, 108.0]],
    maxBoundsViscosity: 0.3,
    dragging: true,
    inertia: true,
    touchZoom: true,
    scrollWheelZoom: true
  }).setView([22.6, 79.0], 5);

  // Esri's free "World Dark Gray Base" — no API key, no usage-policy blocking.
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri',
    maxZoom: 16
  }).addTo(map);

  let markers = {};
  let activeWardId = null;

  function markerIcon(color, isActive) {
    const size = isActive ? 26 : 20;
    return L.divIcon({
      className: '',
      html: `<div style="
        width:${size}px;height:${size}px;border-radius:50%;
        background:${color};
        border:2.5px solid rgba(255,255,255,0.85);
        box-shadow:0 2px 8px rgba(0,0,0,0.5);
      "></div>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
  }

  function renderWardList(wards) {
    const listEl = document.getElementById('wardList');
    if (!wards.length) {
      listEl.innerHTML = '<div class="empty-state">No ward data returned.</div>';
      return;
    }
    const sorted = [...wards].sort((a, b) => b.final_risk_score - a.final_risk_score);
    listEl.innerHTML = '';
    sorted.forEach(w => {
      const color = alertColors[w.alert_level] || '#888';
      const card = document.createElement('div');
      card.className = 'ward-card' + (w.ward_id === activeWardId ? ' active' : '');
      card.innerHTML = `
        <div class="ward-card-top">
          <div>
            <div class="ward-name">${w.ward_name}</div>
            <div class="ward-city">${w.city}</div>
          </div>
          <div class="risk-score" style="color:${color}">${w.final_risk_score}</div>
        </div>
        <div class="ward-card-bottom">
          <span class="alert-badge" style="background:${color}22;color:${color};border:1px solid ${color}55">${w.alert_level}</span>
          <span class="metrics-mini">WBGT ${w.wbgt_c}°C · ${w.temp_c}°C / ${w.rh_pct}% RH</span>
        </div>
      `;
      card.addEventListener('click', () => focusWard(w));
      listEl.appendChild(card);
    });
  }

  function focusWard(w) {
    activeWardId = w.ward_id;
    map.flyTo([w.lat, w.lon], 10, { duration: 0.6 });
    if (markers[w.ward_id]) markers[w.ward_id].openPopup();
    renderWardList(window.__lastWards || []);
    showForecast(w);
  }

  function popupHtml(w) {
    return `
      <div class="popup-title">${w.ward_name}</div>
      <div class="popup-row"><span>City</span><span>${w.city}</span></div>
      <div class="popup-row"><span>Temperature</span><span>${w.temp_c}°C</span></div>
      <div class="popup-row"><span>Humidity</span><span>${w.rh_pct}%</span></div>
      <div class="popup-row"><span>WBGT</span><span>${w.wbgt_c}°C</span></div>
      <div class="popup-row"><span>Heat Index</span><span>${w.heat_index_c}°C</span></div>
      <div class="popup-row"><span>Vulnerability</span><span>${w.vulnerability_index}</span></div>
      <div class="popup-row"><span>Mortality Risk</span><span>${w.mortality_risk_multiplier ?? '—'}x baseline</span></div>
      <div class="popup-row"><span>Risk score</span><span>${w.final_risk_score} / 100</span></div>
      <div class="popup-row"><span>Alert level</span><span>${w.alert_level}</span></div>
    `;
  }

  function renderMarkers(wards) {
    wards.forEach(w => {
      const color = alertColors[w.alert_level] || '#888';
      const isActive = w.ward_id === activeWardId;
      if (markers[w.ward_id]) {
        markers[w.ward_id].setIcon(markerIcon(color, isActive));
        markers[w.ward_id].setPopupContent(popupHtml(w));
      } else {
        const m = L.marker([w.lat, w.lon], { icon: markerIcon(color, isActive) }).addTo(map);
        m.bindPopup(popupHtml(w));
        m.on('click', () => focusWard(w));
        markers[w.ward_id] = m;
      }
    });
  }

  function updateStatusBanner(wards) {
    const extreme = wards.filter(w => w.alert_level === 'Extreme Danger');
    const banner = document.getElementById('statusBanner');
    if (extreme.length > 0) {
      banner.textContent = `⚠ ${extreme.length} ward${extreme.length > 1 ? 's' : ''} at Extreme Danger — immediate action recommended`;
      banner.classList.add('visible');
    } else {
      banner.classList.remove('visible');
    }
  }

  async function loadData() {
    const statusText = document.getElementById('statusText');
    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.disabled = true;
    statusText.innerHTML = '<span class="live-dot" style="background:#E4A73B"></span>Fetching live data…';

    try {
      const res = await fetch(`${API_BASE}/wards/risk`);
      if (!res.ok) throw new Error(`API returned ${res.status}`);
      const data = await res.json();
      window.__lastWards = data.wards;

      renderWardList(data.wards);
      renderMarkers(data.wards);
      updateStatusBanner(data.wards);

      statusText.innerHTML = '<span class="live-dot"></span>Live';
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date(data.generated_at + 'Z').toLocaleTimeString();
    } catch (err) {
      statusText.innerHTML = '<span class="live-dot" style="background:#C22E22"></span>API unreachable';
      document.getElementById('wardList').innerHTML = `
        <div class="empty-state">
          Can't reach the ThermoGuard API.<br/>
          Make sure <code>uvicorn app.main:app --reload</code> is running on your machine,
          then click Refresh.
        </div>`;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  // --- Forecast panel logic ---
  async function showForecast(ward) {
    const panel = document.getElementById('forecastPanel');
    const body = document.getElementById('forecastBody');
    const title = document.getElementById('forecastTitle');

    title.textContent = ward.ward_name;
    panel.classList.add('visible');
    body.innerHTML = '<div class="forecast-loading">Loading forecast…</div>';

    try {
      const res = await fetch(`${API_BASE}/wards/${ward.ward_id}/forecast?days=5`);
      if (!res.ok) throw new Error('Forecast fetch failed');
      const data = await res.json();

      if (!data.forecast_days || data.forecast_days.length === 0) {
        body.innerHTML = '<div class="forecast-loading">No forecast data available.</div>';
        return;
      }

      const dayLabels = ['Today', 'Tomorrow', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'];

      body.innerHTML = data.forecast_days.map((day, i) => {
        const color = alertColors[day.day_alert_level] || '#888';
        const label = dayLabels[i] || day.date;
        return `
          <div class="forecast-day-row">
            <span class="forecast-day-label">${label}</span>
            <span class="forecast-day-badge" style="background:${color}22;color:${color};border:1px solid ${color}55">
              ${day.day_alert_level}
            </span>
          </div>
        `;
      }).join('');

    } catch (err) {
      body.innerHTML = '<div class="forecast-loading">Could not load forecast. Is the API running?</div>';
    }
  }

  function closeForecast() {
    document.getElementById('forecastPanel').classList.remove('visible');
  }

  document.getElementById('refreshBtn').addEventListener('click', loadData);
  loadData();
  setInterval(loadData, 60000);

  window.addEventListener('load', () => setTimeout(() => map.invalidateSize(), 200));
  window.addEventListener('resize', () => map.invalidateSize());
</script>

</body>
</html>
